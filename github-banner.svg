<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Solution Architect, Software Engineer, and AI</title>
  <desc id="desc">A dark, modern GitHub banner highlighting solution architecture, software engineering, and AI systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0b1830"/>
      <stop offset="1" stop-color="#101c3c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#43d9ff"/>
      <stop offset="1" stop-color="#8271ff"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#344d91" stop-opacity=".42"/>
      <stop offset="1" stop-color="#344d91" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9ab4de" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="20" fill="url(#grid)"/>
  <ellipse cx="912" cy="165" rx="350" ry="250" fill="url(#orb)"/>
  <path d="M0 260C235 230 385 307 611 269s360-83 589-42" fill="none" stroke="#4bbbe6" stroke-opacity=".1" stroke-width="1.5"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="72" y="77" fill="#73ddf5" font-size="13" font-weight="700" letter-spacing="3.4">ARCHITECTURE  ·  ENGINEERING  ·  AI</text>
    <text x="70" y="143" fill="#f3f7ff" font-size="43" font-weight="700" letter-spacing="-.8">Solution Architect</text>
    <text x="70" y="195" fill="#f3f7ff" font-size="37" font-weight="500" letter-spacing="-.5">&amp; Software Engineer</text>
    <text x="73" y="236" fill="#a9bad2" font-size="17" font-weight="400">Designing intelligent systems. Building useful software.</text>
    <g transform="translate(73 265)">
      <rect width="104" height="28" rx="14" fill="#182b48" stroke="#416080" stroke-opacity=".65"/>
      <text x="52" y="19" text-anchor="middle" fill="#c8d8ec" font-size="11" font-weight="600" letter-spacing="1.2">CLOUD</text>
      <rect x="116" width="110" height="28" rx="14" fill="#182b48" stroke="#416080" stroke-opacity=".65"/>
      <text x="171" y="19" text-anchor="middle" fill="#c8d8ec" font-size="11" font-weight="600" letter-spacing="1.2">AI &amp; LLMs</text>
      <rect x="226" width="174" height="28" rx="14" fill="#182b48" stroke="#416080" stroke-opacity=".65"/>
      <text x="313" y="19" text-anchor="middle" fill="#c8d8ec" font-size="11" font-weight="600" letter-spacing="1.2">DISTRIBUTED SYSTEMS</text>
    </g>
  </g>

  <g fill="none" stroke="url(#glow)" stroke-width="2" stroke-opacity=".72">
    <path d="M759 151H840M931 151H1007M884 110V74M884 192V226M1049 151H1110M799 151V218H884M1007 151V94H1076"/>
    <path d="M884 151L978 224M884 151L786 93" stroke-opacity=".42"/>
  </g>
  <g fill="#0e1e37" stroke="url(#glow)" stroke-width="2">
    <rect x="840" y="110" width="91" height="82" rx="14"/>
    <rect x="727" y="130" width="72" height="42" rx="10"/>
    <rect x="1007" y="130" width="84" height="42" rx="10"/>
    <rect x="854" y="47" width="60" height="28" rx="8"/>
    <rect x="854" y="226" width="60" height="28" rx="8"/>
    <circle cx="786" cy="93" r="12"/>
    <circle cx="978" cy="224" r="12"/>
    <circle cx="1110" cy="151" r="10"/>
    <circle cx="1076" cy="94" r="10"/>
  </g>
  <g fill="#dceaff" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
    <text x="885.5" y="145" font-size="11">AI</text><text x="885.5" y="163" font-size="11">SYSTEMS</text>
    <text x="763" y="156" font-size="10">API</text><text x="1049" y="156" font-size="10">CLOUD</text>
    <text x="884" y="65" font-size="9">DATA</text><text x="884" y="244" font-size="9">SHIP</text>
  </g>
  <g fill="#68dbf4" filter="url(#softGlow)">
    <circle cx="840" cy="151" r="3.5"/><circle cx="931" cy="151" r="3.5"/><circle cx="884" cy="110" r="3.5"/><circle cx="884" cy="192" r="3.5"/><circle cx="1007" cy="151" r="3.5"/>
  </g>
  <path d="M32 20H96M32 20V58M1168 300h-64m64 0v-38" fill="none" stroke="#63d8f3" stroke-opacity=".55" stroke-width="1.5"/>
</svg>
